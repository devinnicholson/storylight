[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "storylight"
version = "0.1.0"
description = "Privacy-first cloud/edge runtime for responsive illustrated reading"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Devin Nicholson" },
]
keywords = ["edge-ai", "inference", "reading", "speech", "storytelling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx[http2]>=0.28,<1",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
mac-asr = [
    "mlx-whisper>=0.4.3",
]
modal-authoring = [
    "modal>=1.4,<2",
]
gcp = [
    "google-auth[requests]>=2.40,<3",
]
jax-analysis = [
    "tensorboard>=2.20,<3",
]

[project.urls]
Homepage = "https://github.com/devinnicholson/storylight"
Documentation = "https://github.com/devinnicholson/storylight/tree/main/docs"
Issues = "https://github.com/devinnicholson/storylight/issues"
Source = "https://github.com/devinnicholson/storylight"

[dependency-groups]
dev = [
  "numpy>=2,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.sdist]
only-include = ["src/storylight"]

[tool.hatch.build.targets.wheel]
packages = ["src/storylight"]
exclude = [
  "src/storylight/*_benchmark.py",
  "src/storylight/edge_preflight.py",
  "src/storylight/fidelity_*.py",
  "src/storylight/final_asset_manifest.py",
  "src/storylight/handoff_bundle.py",
  "src/storylight/hardware_acceptance.py",
  "src/storylight/klein_latency_client.py",
  "src/storylight/klein_region_client.py",
  "src/storylight/motion_promotion.py",
  "src/storylight/motion_selection.py",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
