[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "storylight"
version = "0.1.0"
description = "Privacy-first cloud/edge runtime for The Book That Listens Back"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx[http2]>=0.28,<1",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
mac-asr = [
    "mlx-whisper>=0.4.3",
]
modal-authoring = [
    "modal>=1.4,<2",
]
gcp = [
    "google-auth[requests]>=2.40,<3",
]
jax-analysis = [
    "tensorboard>=2.20,<3",
]

[dependency-groups]
dev = [
  "numpy>=2,<3",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/storylight"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
