targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = ['''^tokenizer_sha256"\s*:\s*"[a-f0-9]{64}"$''']
paths = [
  '''(?:^|/)benchmarks/scene\-routing\-2026\-09\-04/render\-journal\.jsonl$''',
