  '''(?:^|/)experiments/scene\-cache\-confirmation\-2026\-09\-09/cpu\-preflight\.json$''',
  '''(?:^|/)experiments/scene\-decoding\-feasibility\-2026\-09\-09/cpu\-preflight\.json$''',
