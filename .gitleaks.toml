]

# Gitleaks splits this minified receipt into chunks inside two recorded digests.
[[allowlists]]
description = "Exact SHA256 fragments at scanner chunk boundaries"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ['''(?:^|/)experiments/scene-adapter-v4-2026-09-09/cpu-preflight\.json$''']
regexes = [
  '''^token_and_mask_sha256":\ "a0eee08be08f7d0fb87c218129d64b73cb51e51e15$''',
  '''^token_and_mask_sha256":\ "7701ed3a3ed4ede4f62592266da7b64fbdb5258507c6f3b01bb175271fb5d4b$''',
]

[[allowlists]]
description = "Historical demo deployment digest"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = ['''^installed_api_sha256"\s*:\s*"[a-f0-9]{64}"$''']
paths = ['''(?:^|/)docs/checkpoints/best-demo-2026-09-08/receipt\.json$''']

[[allowlists]]
description = "Historical custody-file SHA256 verification constants"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = ['''^hidden\.key"\s*:\s*"[a-f0-9]{64}"$''']
paths = [
  '''(?:^|/)scripts/backup_fidelity_custody\.py$''',
  '''(?:^|/)tests/test_fidelity_custody_backup\.py$''',
]
