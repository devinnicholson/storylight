# Reviewed publication-tree false positives. Keep all default detection rules.
[extend]
useDefault = true

[[allowlists]]
description = "Deterministic controller test credential"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = ['''^PAIRING_TOKEN\s*=\s*"0123456789abcdef"$''']
paths = [
  '''(?:^|/)tests/test_controller_gateway\.py$''',
]

[[allowlists]]
description = "Recorded SHA256: key2row"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = ['''^key2row"\s*:\s*"[a-f0-9]{64}"$''']
paths = [
  '''(?:^|/)tests/fixtures/voice\-retriever/breed\-adversarial\-rows\.json$''',
  '''(?:^|/)tests/fixtures/voice\-static\-subject/actual\-parser\-rows\.json$''',
  '''(?:^|/)tests/fixtures/voice\-copular\-location\-rows\.json$''',
]

[[allowlists]]
description = "Privacy-rejection test input"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = ['''^password hunter2", result_count=2$''']
paths = [
  '''(?:^|/)tests/test_scene_facts_underlying_regressions\.py$''',
]

[[allowlists]]
description = "Recorded SHA256: tokenizer"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = ['''^tokenizer"\s*:\s*"[a-f0-9]{64}"$''']
paths = [
  '''(?:^|/)tests/fixtures/voice\-retriever/breed\-adversarial\-rows\.json$''',
  '''(?:^|/)tests/fixtures/voice\-static\-subject/actual\-parser\-rows\.json$''',
  '''(?:^|/)tests/fixtures/voice\-copular\-location\-rows\.json$''',
]

[[allowlists]]
description = "Recorded SHA256: tokenizer.json"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = ['''^tokenizer\.json"\s*:\s*"[a-f0-9]{64}"$''']
paths = [
  '''(?:^|/)experiments/scene\-cache\-confirmation\-2026\-09\-09/cpu\-preflight\.json$''',
]

[[allowlists]]
description = "Recorded SHA256: tokenizer_config.json"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = ['''^tokenizer_config\.json"\s*:\s*"[a-f0-9]{64}"$''']
paths = [
  '''(?:^|/)experiments/scene\-cache\-confirmation\-2026\-09\-09/cpu\-preflight\.json$''',
]
