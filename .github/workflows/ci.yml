name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      STORYLIGHT_ALLOW_PAID_WORK: "false"
      STORYLIGHT_CLOUD_EXECUTION: "disabled"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts=--all --redact --no-banner

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.6"
          enable-cache: false

      - name: Install locked development environment
        run: uv sync --locked --dev --extra modal-authoring

      - name: Lint application and deployment code
        run: uv run ruff check src tests scripts deploy infra

      - name: Validate tracked shell scripts
        run: git ls-files -z '*.sh' | xargs -0 -n 1 bash -n

      - name: Run repository tests and fidelity validation
        run: uv run pytest -q

      - name: Test projector interaction and playback
        run: node --test tests/anticipatory_workbench.test.js tests/hand_interaction.test.js tests/demo_cues.test.js
