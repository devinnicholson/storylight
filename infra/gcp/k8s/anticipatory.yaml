apiVersion: v1
kind: ServiceAccount
metadata:
  name: storylight-anticipator
  namespace: storylight
  labels:
    app.kubernetes.io/name: storylight-anticipatory
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: storylight-gpu-watchdog
  namespace: storylight
  labels:
    app.kubernetes.io/name: storylight-nemotron
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: storylight-gpu-watchdog
  namespace: storylight
  labels:
    app.kubernetes.io/name: storylight-nemotron
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["storylight-nemotron"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: storylight-gpu-watchdog
  namespace: storylight
  labels:
    app.kubernetes.io/name: storylight-nemotron
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: storylight-gpu-watchdog
subjects:
  - kind: ServiceAccount
    name: storylight-gpu-watchdog
    namespace: storylight
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: storylight-gpu-watchdog
  namespace: storylight
  labels:
    app.kubernetes.io/name: storylight-nemotron
data:
  watchdog.py: |
    import json
    import os
    import ssl
    import time
    import urllib.request

    time.sleep(int(os.environ["STORYLIGHT_GPU_MAX_RUNTIME_SECONDS"]))
    namespace = os.environ["STORYLIGHT_NAMESPACE"]
    deployment = os.environ["STORYLIGHT_GPU_DEPLOYMENT"]
    identity_root = "/var/run/secrets/storylight"
    with open(f"{identity_root}/token", encoding="utf-8") as token_file:
        token = token_file.read().strip()
    context = ssl.create_default_context(cafile=f"{identity_root}/ca.crt")
    url = (
        "https://kubernetes.default.svc/apis/apps/v1/namespaces/"
        f"{namespace}/deployments/{deployment}/scale"
    )
    body = json.dumps({"spec": {"replicas": 0}}).encode()
    while True:
        request = urllib.request.Request(
            url,
            data=body,
            method="PATCH",
            headers={
                "Authorization": f"Bearer {token}",
                "Content-Type": "application/merge-patch+json",
            },
        )
        try:
            with urllib.request.urlopen(request, context=context, timeout=10) as response:
                if response.status == 200:
                    break
        except Exception as error:
            print(f"GPU watchdog scale-to-zero retry: {error}", flush=True)
        time.sleep(30)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storylight-nim-cache
  namespace: storylight
  labels:
    app.kubernetes.io/name: storylight-nemotron
    app.kubernetes.io/component: nim-cache
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 80Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storylight-nemotron
  namespace: storylight
  labels:
    app.kubernetes.io/name: storylight-nemotron
    app.kubernetes.io/component: visual-critic
spec:
  # The guarded deployment script is the only path that scales this billable
  # GPU workload above zero.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: storylight-nemotron
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storylight-nemotron
        app.kubernetes.io/component: visual-critic
        ai.gke.io/model: llama-3-1-nemotron-nano-vl-8b-v1
        ai.gke.io/inference-server: nvidia-nim
    spec:
      serviceAccountName: storylight-gpu-watchdog
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nemotron-nim
          image: nvcr.io/nim/nvidia/llama-3.1-nemotron-nano-vl-8b-v1@sha256:f4f0ef214fc448af0b9e7a9de84f8d163b21b698d2ad9e4a5d6d8afa8f03b065
          imagePullPolicy: IfNotPresent
          env:
            - name: NGC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ngc-api
                  key: NGC_API_KEY
            - name: NIM_CACHE_PATH
              value: /opt/nim/.cache
            - name: NIM_MAX_MODEL_LEN
              value: "2048"
            - name: NIM_MAX_BATCH_SIZE
              value: "1"
            - name: NIM_LOW_MEMORY_MODE
              value: "1"
            - name: MALLOC_ARENA_MAX
              value: "2"
          ports:
            - name: nim-http
              containerPort: 8000
          resources:
            requests:
              cpu: "6"
              # g2-standard-8 leaves only ~27.6 GiB allocatable. The measured
              # BF16 TensorRT build peaked at 42.50 GB, so this request forces
              # one g2-standard-12 (48 GB host) while retaining exactly one L4.
              memory: 32Gi
              ephemeral-storage: 40Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "6"
              memory: 41Gi
              ephemeral-storage: 40Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /v1/health/ready
              port: nim-http
            timeoutSeconds: 10
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: nim-http
            timeoutSeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /v1/health/live
              port: nim-http
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: nim-cache
              mountPath: /opt/nim/.cache
            - name: dshm
              mountPath: /dev/shm
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        - name: gpu-watchdog
          image: python:3.12-slim-bookworm@sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254
          imagePullPolicy: IfNotPresent
          command: ["python", "/opt/storylight/watchdog.py"]
          env:
            - name: STORYLIGHT_GPU_MAX_RUNTIME_SECONDS
              value: "3600"
            - name: STORYLIGHT_GPU_DEPLOYMENT
              value: storylight-nemotron
            - name: STORYLIGHT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: gpu-watchdog-script
              mountPath: /opt/storylight
              readOnly: true
            - name: gpu-watchdog-identity
              mountPath: /var/run/secrets/storylight
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      imagePullSecrets:
        - name: ngc-secret
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
        cloud.google.com/gke-gpu-driver-version: latest
      volumes:
        - name: nim-cache
          persistentVolumeClaim:
            claimName: storylight-nim-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
        - name: gpu-watchdog-script
          configMap:
            name: storylight-gpu-watchdog
            defaultMode: 0555
        - name: gpu-watchdog-identity
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 7200
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: storylight-nemotron
  namespace: storylight
  labels:
    app.kubernetes.io/name: storylight-nemotron
spec:
  selector:
    app.kubernetes.io/name: storylight-nemotron
  ports:
    - name: nim-http
      port: 8000
      targetPort: nim-http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storylight-anticipatory
  namespace: storylight
  labels:
    app.kubernetes.io/name: storylight-anticipatory
    app.kubernetes.io/component: anticipatory-api
spec:
  # The CPU control plane stays independently deployable; changing it never
  # restarts the expensive TensorRT/NIM process.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storylight-anticipatory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storylight-anticipatory
        app.kubernetes.io/component: anticipatory-api
    spec:
      serviceAccountName: storylight-anticipator
      terminationGracePeriodSeconds: 10
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: anticipatory-api
          image: storylight-anticipatory-placeholder
          imagePullPolicy: IfNotPresent
          env:
            - name: STORYLIGHT_RENDERER_URL
              value: https://renderer.invalid
            - name: STORYLIGHT_RENDERER_AUDIENCE
              value: https://renderer.invalid
            - name: STORYLIGHT_RENDERER_GPU
              value: RTX_PRO_6000
            - name: STORYLIGHT_ANTICIPATORY_RENDER_TIMEOUT_SECONDS
              value: "30"
            - name: STORYLIGHT_ANTICIPATORY_MAX_RENDERS
              value: "1"
            - name: STORYLIGHT_ANTICIPATORY_MAX_CANDIDATES
              value: "64"
            - name: STORYLIGHT_ANTICIPATORY_CACHE_ENTRIES
              value: "32"
            - name: STORYLIGHT_ANTICIPATORY_ASSET_BYTES
              value: "67108864"
            - name: STORYLIGHT_NEMOTRON_BASE_URL
              value: http://storylight-nemotron.storylight.svc.cluster.local:8000
            - name: STORYLIGHT_NEMOTRON_TIMEOUT_SECONDS
              value: "30"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 2
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              # Keep API lifecycle independent from the optional GPU critic.
              # /ready remains available for dependency-aware diagnostics.
              path: /health
              port: http
            timeoutSeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 2
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: storylight-anticipatory
  namespace: storylight
  labels:
    app.kubernetes.io/name: storylight-anticipatory
spec:
  selector:
    app.kubernetes.io/name: storylight-anticipatory
  ports:
    - name: http
      port: 8080
      targetPort: http
  # There is deliberately no public load balancer. Experiments use a localhost
  # port-forward; production ingress requires a separate authentication gate.
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: storylight-anticipatory
  namespace: storylight
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: storylight-anticipatory
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: storylight
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: storylight-nemotron
      ports:
        - protocol: TCP
          port: 8000
    # GKE Workload Identity Federation retrieves short-lived credentials from
    # a link-local metadata server. Dataplane V2 uses :80; :988 keeps the
    # policy portable to clusters using the earlier metadata-server path.
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
    - to:
        - ipBlock:
            cidr: 169.254.169.252/32
      ports:
        - protocol: TCP
          port: 988
    - ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: storylight-nemotron
  namespace: storylight
  labels:
    app.kubernetes.io/name: storylight-nemotron
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: storylight-nemotron
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: storylight-anticipatory
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
