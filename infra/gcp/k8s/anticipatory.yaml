apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookforge-anticipator
  namespace: bookforge
  labels:
    app.kubernetes.io/name: bookforge-anticipatory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookforge-anticipatory
  namespace: bookforge
  labels:
    app.kubernetes.io/name: bookforge-anticipatory
    app.kubernetes.io/component: anticipatory-story-engine
spec:
  # The guarded deployment script installs the object at zero and scales it only
  # after the image, identity, secret, quota, and rollback path are validated.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bookforge-anticipatory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookforge-anticipatory
        app.kubernetes.io/component: anticipatory-story-engine
        ai.gke.io/model: llama-3-1-nemotron-nano-vl-8b-v1
        ai.gke.io/inference-server: nvidia-nim
    spec:
      serviceAccountName: bookforge-anticipator
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nemotron-nim
          image: nvcr.io/nim/nvidia/llama-3.1-nemotron-nano-vl-8b-v1@sha256:f4f0ef214fc448af0b9e7a9de84f8d163b21b698d2ad9e4a5d6d8afa8f03b065
          imagePullPolicy: IfNotPresent
          env:
            - name: NGC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ngc-api
                  key: NGC_API_KEY
            - name: NIM_CACHE_PATH
              value: /opt/nim/.cache
            - name: NIM_MAX_MODEL_LEN
              value: "4096"
          ports:
            - name: nim-http
              containerPort: 8000
          resources:
            requests:
              cpu: "6"
              memory: 16Gi
              ephemeral-storage: 40Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "6"
              memory: 16Gi
              ephemeral-storage: 40Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /v1/health/ready
              port: nim-http
            timeoutSeconds: 10
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: nim-http
            timeoutSeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /v1/health/live
              port: nim-http
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: nim-cache
              mountPath: /opt/nim/.cache
            - name: dshm
              mountPath: /dev/shm
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        - name: anticipatory-api
          image: bookforge-anticipatory-placeholder
          imagePullPolicy: IfNotPresent
          env:
            - name: BOOKFORGE_RENDERER_URL
              value: https://renderer.invalid
            - name: BOOKFORGE_RENDERER_AUDIENCE
              value: https://renderer.invalid
            - name: BOOKFORGE_RENDERER_GPU
              value: RTX_PRO_6000
            - name: BOOKFORGE_ANTICIPATORY_RENDER_TIMEOUT_SECONDS
              value: "30"
            - name: BOOKFORGE_ANTICIPATORY_MAX_RENDERS
              value: "2"
            - name: BOOKFORGE_ANTICIPATORY_MAX_CANDIDATES
              value: "64"
            - name: BOOKFORGE_ANTICIPATORY_CACHE_ENTRIES
              value: "32"
            - name: BOOKFORGE_ANTICIPATORY_ASSET_BYTES
              value: "67108864"
            - name: BOOKFORGE_NEMOTRON_TIMEOUT_SECONDS
              value: "30"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 2
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            timeoutSeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 2
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      imagePullSecrets:
        - name: ngc-secret
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
        cloud.google.com/gke-gpu-driver-version: latest
      volumes:
        - name: nim-cache
          emptyDir:
            sizeLimit: 40Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bookforge-anticipatory
  namespace: bookforge
  labels:
    app.kubernetes.io/name: bookforge-anticipatory
spec:
  selector:
    app.kubernetes.io/name: bookforge-anticipatory
  ports:
    - name: http
      port: 8080
      targetPort: http
  # There is deliberately no public load balancer. The first bounded experiment
  # uses kubectl port-forward; production ingress requires a separate auth gate.
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bookforge-anticipatory
  namespace: bookforge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bookforge-anticipatory
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bookforge
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
