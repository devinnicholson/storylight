apiVersion: apps/v1
kind: Deployment
metadata:
  name: storylight-api
  namespace: storylight
  labels:
    app.kubernetes.io/name: storylight-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storylight-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storylight-api
    spec:
      containers:
        - name: api
          image: storylight-api-placeholder
          env:
            - name: STORYLIGHT_ENVIRONMENT
              value: gcp
            - name: STORYLIGHT_MODEL_BACKEND
              value: openai
            - name: STORYLIGHT_MODEL_NAME
              value: google/gemma-4-e2b-it
            - name: STORYLIGHT_MODEL_BASE_URL
              value: http://gemma-vllm:8000
            - name: STORYLIGHT_MODEL_TIMEOUT_SECONDS
              value: "300"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: storylight-api
  namespace: storylight
spec:
  selector:
    app.kubernetes.io/name: storylight-api
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
