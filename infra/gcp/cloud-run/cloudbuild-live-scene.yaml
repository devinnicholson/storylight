steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker pull "${_CACHE_IMAGE}" || true
        docker build --cache-from "${_CACHE_IMAGE}" -t "${_IMAGE}" .
images:
  - "${_IMAGE}"
timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
