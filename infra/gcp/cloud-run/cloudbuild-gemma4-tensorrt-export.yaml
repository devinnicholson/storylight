steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker pull "${_IMAGE}" || true
        docker build \
          --cache-from "${_IMAGE}" \
          --build-arg EDGELLM_REVISION=71dd1bae032e70771265917ec74d3ff4cad07a10 \
          --tag "${_IMAGE}" \
          .
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}"]
images:
  - "${_IMAGE}"
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
